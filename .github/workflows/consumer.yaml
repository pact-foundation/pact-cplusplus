name: Consumer Project
on:
  push:
  release:
    types: [published]

env:
  PACT_FFI_VERSION: v0.5.0
  CONAN_REMOTE: ${{ github.event.inputs.conan_remote || 'pact-foundation' }}
  CONAN_REMOTE_URL: https://pactfoundation.jfrog.io/artifactory/api/conan/pactfoundation-conan

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ffi_arch: linux-x86_64
          - os: ubuntu-22.04-arm
            ffi_arch: linux-aarch64
          - os: macos-latest
            ffi_arch: macos-aarch64
          - os: windows-latest
            ffi_arch: windows-x86_64
          - os: ubuntu-latest
            ffi_arch: linux-x86_64-musl
            container: alpine:3.20
          - os: ubuntu-22.04-arm
            ffi_arch: linux-aarch64-musl
            container: alpine:3.20
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install act dependencies
        if: env.ACT == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev libz-dev liblzma-dev libicu-dev libboost-all-dev cmake
      - name: Install linux dependencies
        if: env.ACT != 'true' && !matrix.container && ( matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-22.04-arm' )
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev libz-dev liblzma-dev
      - run: cmake --version
        if: ${{ !matrix.container }}

      - name: Install conan
        if: ${{ !matrix.container }}
        run: |
          pip3 install --upgrade pip
          pip3 install "conan>=2.0"
          conan --version

      - name: Download pact_ffi
        run: |
          set -euo pipefail
          root="consumer/libpact_ffi-${PACT_FFI_VERSION}"
          base="https://github.com/pact-foundation/pact-reference/releases/download/libpact_ffi-${PACT_FFI_VERSION}"
          mkdir -p "$root/include" "$root/lib"
          curl -sSfL -o "$root/include/pact.h" "$base/pact.h"
          curl -sSfL -o "$root/include/pact-cpp.h" "$base/pact-cpp.h"
          case "${{ matrix.ffi_arch }}" in
            windows-*) files="pact_ffi-windows-x86_64.lib pact_ffi-windows-x86_64.dll" ;;
            macos-*)   files="libpact_ffi-macos-aarch64.a libpact_ffi-macos-aarch64.dylib libpact_ffi-macos-x86_64.a libpact_ffi-macos-x86_64.dylib" ;;
            linux-*)    files="libpact_ffi-${{ matrix.ffi_arch }}.a libpact_ffi-${{ matrix.ffi_arch }}.so" ;;
          esac
          for f in $files; do
            curl -sSfL -o "$root/lib/$f.gz" "$base/$f.gz"
            gunzip -f "$root/lib/$f.gz"
          done
          echo "PACT_FFI_ROOT=$PWD/$root" >> $GITHUB_ENV

      - name: Create conan profile
        if: ${{ !matrix.container }}
        run: |
          conan profile detect --force
          conan profile show

      - name: Cache conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}${{ matrix.container && '-musl' || '' }}-${{ hashFiles('consumer/conanfile.py') }}
          restore-keys: |
            conan-${{ matrix.os }}${{ matrix.container && '-musl' || '' }}-

      - name: Conan install dependencies
        if: ${{ !matrix.container }}
        run: |
          conan install conanfile.py \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=17 \
            -c tools.build:jobs=2
        working-directory: consumer

      # Drop source/build temporaries so only the built packages are cached
      - name: Trim conan cache
        if: ${{ !matrix.container }}
        run: conan cache clean "*" --source --build --temp

      - name: Build library and tests
        if: ${{ !matrix.container }}
        run: |
          # Multi-config generators (MSVC) expose 'conan-default' instead of 'conan-release'
          if [ "${{ runner.os }}" = "Windows" ]; then preset=conan-default; else preset=conan-release; fi
          cmake --preset $preset \
            -DPactUseConan=ON \
            -DPactBuildTests=ON \
            -DPACT_FFI_VERSION=$PACT_FFI_VERSION \
            -DPACT_FFI_ROOT="$PACT_FFI_ROOT"
          cmake --build --preset conan-release
        working-directory: consumer

      - name: Run pact-consumer-tests
        if: ${{ !matrix.container }}
        run: ctest --preset conan-release --output-on-failure --verbose
        working-directory: consumer
        env:
          LOG_LEVEL: DEBUG

      # musl (Alpine) builds run via `docker run`, bind-mounting the workspace, conan cache
      # and apk cache dirs, so no Node.js/actions compatibility shim is needed in the container.
      # Release packaging/upload runs in the same invocation so it shares the container's toolchain.
      - name: Build, test and release (musl container)
        if: ${{ matrix.container }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "$HOME/.conan2:/root/.conan2" \
            -w /workspace/consumer \
            -e PACT_FFI_VERSION \
            -e PACT_FFI_ROOT=/workspace/consumer/libpact_ffi-$PACT_FFI_VERSION \
            -e LOG_LEVEL=DEBUG \
            -e FFI_ARCH="${{ matrix.ffi_arch }}" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e CONAN_REMOTE="$CONAN_REMOTE" \
            -e CONAN_REMOTE_URL="$CONAN_REMOTE_URL" \
            -e CONAN_USER="${{ secrets.JFROG_USER }}" \
            -e CONAN_PASSWORD="${{ secrets.JFROG_ACCESS_TOKEN }}" \
            ${{ matrix.container }} sh -c '
              set -euo pipefail
              apk add build-base cmake curl python3 py3-pip bzip2-dev zlib-dev xz-dev openssl gzip linux-headers
              pip3 install --upgrade pip --break-system-packages
              pip3 install "conan>=2.0" --break-system-packages
              conan profile detect --force
              conan install conanfile.py --build=missing -s build_type=Release -s compiler.cppstd=17 -c tools.build:jobs=2
              conan cache clean "*" --source --build --temp
              cmake --preset conan-release -DPactUseConan=ON -DPactBuildTests=ON -DPACT_FFI_VERSION="$PACT_FFI_VERSION" -DPACT_FFI_ROOT="$PACT_FFI_ROOT"
              cmake --build --preset conan-release
              ctest --preset conan-release --output-on-failure --verbose

              if [ "$GITHUB_EVENT_NAME" = "release" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                cmake --install build/Release --config Release --prefix install
              fi

              if [ "$GITHUB_EVENT_NAME" = "release" ]; then
                mkdir -p artifacts
                lib=$(find install/pact-cpp-consumer -type f -name "*pact-cpp-consumer.*" | head -1)
                name=$(basename "$lib")
                gzip -c "$lib" > "artifacts/${name%.*}-${FFI_ARCH}.${name##*.}.gz"
                cp include/*.h artifacts
                (cd artifacts && for f in *.gz; do openssl dgst -sha256 -r "$f" > "$f.sha256"; done)

                conan create conanfile.py --build=missing -s build_type=Release -s compiler.cppstd=17 -c tools.build:jobs=2
                conan remote add "$CONAN_REMOTE" "$CONAN_REMOTE_URL" --force
                conan remote login "$CONAN_REMOTE" "$CONAN_USER" -p "$CONAN_PASSWORD"
                conan upload "pact_cpp_consumer/*" -r="$CONAN_REMOTE" --confirm
              fi
            '

      # Release-only steps below reuse the conan cache and build tree from the steps above
      - name: Install library
        if: ${{ !matrix.container && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then builddir=build; else builddir=build/Release; fi
          cmake --install "$builddir" --config Release --prefix install
        working-directory: consumer

      - name: Package release artifacts
        if: ${{ !matrix.container && github.event_name == 'release' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          lib=$(find install/pact-cpp-consumer -type f -name "*pact-cpp-consumer.*" | head -1)
          name=$(basename "$lib")
          gzip -c "$lib" > "artifacts/${name%.*}-${{ matrix.ffi_arch }}.${name##*.}.gz"
          cp include/*.h artifacts
          (cd artifacts && for f in *.gz; do openssl dgst -sha256 -r "$f" > "$f.sha256"; done)
        working-directory: consumer

      - name: Create conan package
        if: ${{ !matrix.container && github.event_name == 'release' }}
        run: |
          conan create conanfile.py \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=17 \
            -c tools.build:jobs=2
        working-directory: consumer

      - name: Upload conan package
        if: ${{ !matrix.container && github.event_name == 'release' }}
        run: |
          conan remote add "$CONAN_REMOTE" "$CONAN_REMOTE_URL" --force
          conan remote login "$CONAN_REMOTE" "$CONAN_USER" -p "$CONAN_PASSWORD"
          conan upload "pact_cpp_consumer/*" -r="$CONAN_REMOTE" --confirm
        working-directory: consumer
        env:
          CONAN_USER: ${{ secrets.JFROG_USER }}
          CONAN_PASSWORD: ${{ secrets.JFROG_ACCESS_TOKEN }}

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: consumer/artifacts/*
          file_glob: true
          tag: ${{ github.ref }}
