name: Release
on:
  push:
    tags:
      - "pact-cpp-consumer-v*"
      - "pact-cpp-verifier-v*"

# Releases are source-only: the GitHub release carries the tagged source and
# notes naming the pact_ffi version it pins. No binaries are built or uploaded;
# users build with CMake (FetchContent) or `conan create` from the tag.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches the component version
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            pact-cpp-consumer-v*) comp=consumer ;;
            pact-cpp-verifier-v*) comp=verifier ;;
            *) echo "::error::unexpected tag $tag"; exit 1 ;;
          esac
          version="${tag#pact-cpp-${comp}-v}"

          conan_version=$(sed -n 's/^ *version = "\(.*\)"/\1/p' "$comp/conanfile.py")
          cmake_version=$(sed -n "s/^project(pact-cpp-${comp} VERSION \([^ )]*\)).*/\1/p" "$comp/CMakeLists.txt")
          ffi_version=$(sed -n 's/^set(PACT_FFI_VERSION "\([^"]*\)".*/\1/p' "$comp/CMakeLists.txt")
          echo "tag=$version conanfile=$conan_version cmake=$cmake_version pact_ffi=$ffi_version"
          if [ "$version" != "$conan_version" ] || [ "$version" != "$cmake_version" ]; then
            echo "::error::tag version $version does not match conanfile.py ($conan_version) or CMakeLists.txt ($cmake_version)"
            exit 1
          fi
          {
            echo "comp=$comp"
            echo "version=$version"
            echo "ffi_version=$ffi_version"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          COMP: ${{ steps.meta.outputs.comp }}
          VERSION: ${{ steps.meta.outputs.version }}
          FFI_VERSION: ${{ steps.meta.outputs.ffi_version }}
        run: |
          cat > notes.md <<NOTES
          Source release of \`pact-cpp-${COMP}\` ${VERSION}, built against
          [pact_ffi ${FFI_VERSION}](https://github.com/pact-foundation/pact-reference/releases/tag/libpact_ffi-${FFI_VERSION}).
          No prebuilt binaries are attached: CMake downloads and checksum-verifies
          pact_ffi for your platform at configure time.

          **CMake FetchContent**

          \`\`\`cmake
          FetchContent_Declare(pact_cpp_${COMP}
            GIT_REPOSITORY https://github.com/pact-foundation/pact-cplusplus.git
            GIT_TAG        ${GITHUB_REF_NAME}
            SOURCE_SUBDIR  ${COMP})
          FetchContent_MakeAvailable(pact_cpp_${COMP})
          target_link_libraries(my_tests PRIVATE pact-cpp-${COMP})
          \`\`\`

          **Conan**

          \`\`\`console
          git clone --branch ${GITHUB_REF_NAME} https://github.com/pact-foundation/pact-cplusplus.git
          conan create pact-cplusplus/${COMP} -s compiler.cppstd=17 --build=missing
          \`\`\`

          See the [installation guide](https://github.com/pact-foundation/pact-cplusplus#installation) for details.
          NOTES
          prev=$(git tag --list "pact-cpp-${COMP}-v*" --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          args=(--title "pact-cpp-${COMP} ${VERSION}" --notes-file notes.md --generate-notes --verify-tag)
          if [ -n "$prev" ]; then args+=(--notes-start-tag "$prev"); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
